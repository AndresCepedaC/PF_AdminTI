# /etc/cups/cupsd.conf - Configuración CUPS para TECHMARKET S.A.S.
LogLevel warn
PageLogFormat

# Escuchar en todas las interfaces en el puerto 631
Port 631
Listen /run/cups/cups.sock

# Difusión en la red local
Browsing On
BrowseLocalProtocols dnssd

# Autenticación y cifrado
DefaultAuthType Basic
WebInterface Yes

# Restricciones por ubicación
<Location />
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.0.0/16
  Allow 10.0.0.0/8
</Location>

<Location /admin>
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.0.0/16
  Allow 10.0.0.0/8
  AuthType Default
  Require user @lpadmin
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @lpadmin
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.0.0/16
  Allow 10.0.0.0/8
</Location>

<Location /printers>
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.0.0/16
  Allow 10.0.0.0/8
</Location>
