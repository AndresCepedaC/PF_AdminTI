# /etc/ntp.conf - Configuración NTP para TECHMARKET S.A.S.
# Servidores autoritativos públicos (Stratum 1 y 2)
driftfile /var/lib/ntp/ntp.drift

# Servidores globales y de la región
server 0.south-america.pool.ntp.org iburst
server 1.south-america.pool.ntp.org iburst
server 2.south-america.pool.ntp.org iburst
server pool.ntp.org iburst

# Restricciones por defecto: denegar consultas y modificaciones externas
restrict -4 default kod notrap nomodify nopeer noquery limited
restrict -6 default kod notrap nomodify nopeer noquery limited

# Permitir control total al host local
restrict 127.0.0.1
restrict ::1

# Permitir sincronización a los clientes de la red local de TECHMARKET
restrict 192.168.0.0 mask 255.255.0.0 nomodify notrap
restrict 10.0.0.0 mask 255.0.0.0 nomodify notrap

# Registro de estadísticas
statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable
