# /etc/samba/smb.conf - Configuración SAMBA para TECHMARKET S.A.S.
[global]
   workgroup = TECHMARKET
   server string = Servidor de Archivos TechMarket
   netbios name = SRV-INFRA
   security = user
   map to guest = bad user
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes

# Recurso Compartido General (Lectura para todos, Escritura para Admin)
[general]
   path = /srv/samba/techmarket/general
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 0775
   directory mask = 0775
   comment = Documentación General y Plantillas TechMarket

# Área de Ventas y Facturación Local
[ventas]
   path = /srv/samba/techmarket/ventas
   browseable = yes
   read only = no
   guest ok = no
   valid users = @ventas, @admin
   write list = @ventas, @admin
   create mask = 0770
   directory mask = 0770
   comment = Cotizaciones, Clientes y Pedidos TechMarket

# Área de Importaciones y Aduanas (Confidencial USA/China)
[importaciones]
   path = /srv/samba/techmarket/importaciones
   browseable = yes
   read only = no
   guest ok = no
   valid users = @compras, @admin
   write list = @compras, @admin
   create mask = 0770
   directory mask = 0770
   comment = Documentos Aduaneros DIAN, DEX, Pagos Swift y Packing Lists

# Área de Logística y Bodega
[despachos]
   path = /srv/samba/techmarket/despachos
   browseable = yes
   read only = no
   guest ok = no
   valid users = @bodega, @ventas, @admin
   write list = @bodega, @admin
   create mask = 0775
   directory mask = 0775
   comment = Guías de Transporte, Seriales y Despachos
